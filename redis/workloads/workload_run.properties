# YCSB Run-phase workload: 95% Read / 4% Update / 1% Delete
# Zipfian key distribution with theta=0.99
#
# This configuration mirrors ycsb/workloads/workload_run.properties
# to ensure identical workload conditions for comparison benchmarks.

workload=site.ycsb.workloads.CoreWorkload

# Key/value configuration
fieldcount=1
fieldlength=1024
recordcount=1000000
operationcount=1000000

# Operation mix
readproportion=0.95
updateproportion=0.04
insertproportion=0.0
deleteproportion=0.01
scanproportion=0.0

# Key selection
requestdistribution=zipfian
zipfian.constant=0.99

# Scaling guide:
#   1M keys:   recordcount=1000000    operationcount=1000000
#  10M keys:   recordcount=10000000   operationcount=10000000
#  50M keys:   recordcount=50000000   operationcount=50000000
# 100M keys:   recordcount=100000000  operationcount=100000000
#
# Adjust threadcount (default 8) for higher throughput.
# Increase fieldlength (default 1024) to test larger values up to 1048576 (1 MiB).
