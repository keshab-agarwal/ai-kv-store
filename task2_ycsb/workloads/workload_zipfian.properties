# YCSB Workload: Zipfian (read-heavy with skewed access)
#
# This workload models a realistic read-heavy cache/store pattern:
#   95% reads, 4% updates, 1% deletes
#
# Compatible with standard YCSB (Java) format. The 95/5 split between
# read and update is the YCSB-standard encoding. Our Go benchmark tool
# further splits the 5% update portion into 4% updates and 1% deletes
# internally (since YCSB does not natively support deleteproportion).
#
# To use with standard YCSB Java: these proportions define a 95/5
# read/update workload. Our custom Go binding handles the delete split.

workload=site.ycsb.workloads.CoreWorkload

# Operation mix (YCSB-compatible encoding)
readproportion=0.95
updateproportion=0.05
scanproportion=0
insertproportion=0

# Access pattern: Zipfian (hot keys accessed far more frequently)
requestdistribution=zipfian

# Data set size
recordcount=1000000
operationcount=10000000

# Value configuration: single field of 1024 bytes
fieldcount=1
fieldlength=1024

# Table name (unused by our binding, included for YCSB compatibility)
table=usertable

# Zipfian constant (theta) - higher values = more skew
# Default YCSB value is 0.99
zipfian.constant=0.99
