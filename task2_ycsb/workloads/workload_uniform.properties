# YCSB Workload: Uniform (read-heavy with uniform access)
#
# Same operation mix as the Zipfian workload but with uniform random
# key selection. Useful as a comparison baseline: uniform access
# eliminates caching advantages and stresses all keys equally.
#
#   95% reads, 4% updates, 1% deletes
#
# See workload_zipfian.properties for details on the delete encoding.

workload=site.ycsb.workloads.CoreWorkload

# Operation mix (YCSB-compatible encoding)
readproportion=0.95
updateproportion=0.05
scanproportion=0
insertproportion=0

# Access pattern: Uniform (all keys equally likely)
requestdistribution=uniform

# Data set size
recordcount=1000000
operationcount=10000000

# Value configuration: single field of 1024 bytes
fieldcount=1
fieldlength=1024

# Table name (unused by our binding, included for YCSB compatibility)
table=usertable
