\* TLC configuration for KVStore — BUG MODE
\* BugMode=TRUE skips the majority replication check,
\* allowing writes to commit with only the coordinator's ack.
\* This should produce a counterexample violating ReadConsistency
\* or NoPhantomReads after a crash+recovery scenario.

CONSTANTS
    Clients = {c1, c2}
    Replicas = {r1, r2, r3}
    Keys = {k1}
    Values = {v1}
    MaxOps = 3
    MaxCrashes = 1
    BugMode = TRUE

SPECIFICATION Spec

CHECK_DEADLOCK
    FALSE

INVARIANTS
    TypeOK
    SafetyInvariant
